name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc
            os: ubuntu-latest
            cc: gcc
          - name: ubuntu-clang
            os: ubuntu-latest
            cc: clang
          - name: macos-arm64-apple-clang
            os: macos-latest
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -a
          "$CC" --version
          command -v make && make --version | head -n 1
          ls -l /bin/sh
          perl -e 'print "perl $^V\n"'

      - name: macOS leg must be Apple Silicon with Apple clang
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          "$CC" --version | grep -q 'Apple clang'

      - name: ASan needs vm.mmap_rnd_bits <= 28 on some runner kernels
        if: runner.os == 'Linux'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: shellcheck (POSIX sh)
        if: runner.os == 'Linux' && matrix.cc == 'gcc'
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          shellcheck -s sh scripts/*.sh

      - name: Lint
        run: make lint

      - name: Harness self-test
        run: make selftest

      - name: Verify every starter and solution
        run: make verify

      - name: Working tree is clean (no build artifacts left)
        run: |
          git status --porcelain --ignored
          test -z "$(git status --porcelain --ignored)"
